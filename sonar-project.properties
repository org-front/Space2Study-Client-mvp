# =============================================================================
# SonarCloud — заготовка для студентів
# =============================================================================
# 1. Зареєструйтесь на https://sonarcloud.io (увійдіть через GitHub).
# 2. Create organization → імпортуйте цей GitHub-репозиторій (або Analyze new project).
# 3. Скопіюйте Organization Key і Project Key з SonarCloud і вставте НИЖЧЕ
#    замість CHANGE_ME (без лапок, без пробілів).
# 4. У GitHub: Settings → Secrets and variables → Actions → New repository secret
#    Ім'я: SONAR_TOKEN
#    Значення: токен з SonarCloud → My Account → Security → Generate Tokens
#    Токен у git НЕ комітити.
# 5. Після цього CI-крок "SonarCloud Scan" у .github/workflows/main.yaml
#    почне запускатися сам (зараз він пропускається, доки секрету немає).
# =============================================================================

# Унікальний ключ ВАШОГО проєкту (SonarCloud → Project Information / Project Key)
sonar.projectKey=CHANGE_ME

# Ключ ВАШОЇ організації (не display name; SonarCloud → My Organizations)
sonar.organization=CHANGE_ME

# Довільна назва в UI SonarCloud
sonar.projectName=Client MVP

# Шляхи відносно цього файлу. На Windows у значеннях використовуйте "/".
sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/tests/**/*
sonar.coverage.exclusions=**/src/constants/**,**/tests/**

sonar.sourceEncoding=UTF-8

# Звіти, які генерує `npm test` (Vitest + vitest-sonar-reporter)
sonar.javascript.lcov.reportPaths=./tests/coverage/lcov.info
sonar.testExecutionReportPaths=./test-report.xml
